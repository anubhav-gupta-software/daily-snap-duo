name: DailySnapDuo
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DailySnapDuo:
    type: application
    platform: iOS
    sources:
      - path: DailySnapDuo
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dailysnapduo
        INFOPLIST_FILE: DailySnapDuo/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: DailySnapDuo/DailySnapDuo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Daily Snap Duo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DailySnapDuoWidget
        embed: true
        codeSign: true
  DailySnapDuoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DailySnapDuoWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dailysnapduo.widget
        INFOPLIST_FILE: DailySnapDuoWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: DailySnapDuoWidget/DailySnapDuoWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Daily Snap Duo
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  DailySnapDuoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailySnapDuoTests
    dependencies:
      - target: DailySnapDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dailysnapduo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DailySnapDuo.app/DailySnapDuo
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DailySnapDuo:
    build:
      targets:
        DailySnapDuo: all
        DailySnapDuoWidget: all
        DailySnapDuoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailySnapDuoTests
    archive:
      config: Release
